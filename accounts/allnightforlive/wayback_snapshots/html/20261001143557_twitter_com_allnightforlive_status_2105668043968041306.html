  可是我快要做不到了吧？
  <br/>
  「不要再畫了呀？」「很難看呀。」「即使這麼畫下去也不會有所增進的。」「你的風格簡直就是糞便。」
  <br/>
  <br/>
  我好像把那些說給自己的話全部都嘔吐出來了。
